<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tilt-O-Meter</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100vh;
            font-family: 'Arial Black', Impact, sans-serif;
            color: white;
            text-shadow: 2px 2px 4px #000;
        }

        #debug-panel {
            display: none;
        }

        .tilt-container {
            width: 120px;
            height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 28px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #f1c40f;
            text-shadow: 0 0 10px rgba(241, 196, 15, 0.8);
        }

        .glass-tube {
            width: 50px;
            height: 300px;
            background: rgba(0, 0, 0, 0.6);
            border: 4px solid #34495e;
            border-radius: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.8);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .liquid {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            background: linear-gradient(to top, #f1c40f, #e67e22, #e74c3c, #c0392b);
            transition: height 0.3s ease-out;
            box-shadow: 0 0 20px #e74c3c;
        }

        .percent {
            position: absolute;
            width: 100%;
            text-align: center;
            bottom: 10px;
            font-size: 16px; 
            z-index: 2;
        }

        .alarm {
            animation: flash 0.3s infinite alternate;
        }

        @keyframes flash {
            0% { border-color: #c0392b; box-shadow: 0 0 30px #c0392b; }
            100% { border-color: #ff0000; box-shadow: 0 0 80px #ff0000; transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <div class="tilt-container">
        <div class="title">TILT</div>
        <div class="glass-tube" id="tube">
            <div class="liquid" id="liquid"></div>
            <div class="percent" id="percent-text">0%</div>
        </div>
    </div>

    <audio id="sirenSound" loop></audio>

<script>
    
    const TWITCH_CHANNEL = 'YOUR NAME'; 
    const STEP = 15; // Процентов за команду
    const LOCK_MINUTES = 5; // Время блокировки 

    const TOTAL_SOUNDS = 4; 

    let currentTilt = 0;
    let isAlarmTriggered = false;
    let isLocked = false;
    let lockTimer = null;
    let countdownInterval = null;

    const liquidEl = document.getElementById('liquid');
    const percentText = document.getElementById('percent-text');
    const tubeEl = document.getElementById('tube');
    const siren = document.getElementById('sirenSound');

    function updateUI() {
        liquidEl.style.height = `${currentTilt}%`;
        if (!isLocked) {
            percentText.innerText = `${currentTilt}%`;
        }
        
        if (currentTilt === 100 && !isAlarmTriggered) {
            isAlarmTriggered = true;
            isLocked = true; 
            tubeEl.classList.add('alarm');

            const randomId = Math.floor(Math.random() * TOTAL_SOUNDS) + 1;
            siren.src = `sounds/${randomId}.mp3`;
            siren.volume = 0.5;
            siren.play().catch(e => console.log("Блокировка автоплея"));

            let timeLeft = LOCK_MINUTES * 60;
            countdownInterval = setInterval(() => {
                timeLeft--;
                const mins = Math.floor(timeLeft / 60);
                const secs = timeLeft % 60;
                percentText.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;

                if (timeLeft <= 0) {
                    resetTilt();
                }
            }, 1000);
        }
    }

    function resetTilt() {
        isAlarmTriggered = false;
        isLocked = false;
        clearInterval(countdownInterval);
        clearTimeout(lockTimer);
        
        currentTilt = 0;
        tubeEl.classList.remove('alarm');
        siren.pause();
        siren.currentTime = 0;
        
        liquidEl.style.height = `0%`;
        percentText.innerText = `0%`;
    }

    const socket = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

    socket.onopen = () => {
        socket.send('CAP REQ :twitch.tv/tags');
        socket.send('NICK justinfan' + Math.floor(Math.random() * 80000 + 1000));
        socket.send('JOIN #' + TWITCH_CHANNEL.toLowerCase());
    };

    socket.onmessage = (event) => {
        const raw = event.data;

        if (raw.startsWith('PING')) {
            socket.send('PONG :tmi.twitch.tv');
            return;
        }

        const trigger = `PRIVMSG #${TWITCH_CHANNEL.toLowerCase()} :`;
        if (raw.includes(trigger)) {
            const message = raw.split(trigger)[1].trim().toLowerCase();

            if (message === '!tilt' || message === '!tilt +' || message === '!тильт' || message === '!тильт +') {
                if (!isLocked && currentTilt < 100) {
                    currentTilt += STEP;
                    if (currentTilt > 100) currentTilt = 100;
                    updateUI();
                }
            }

            if (message === '!tilt -' || message === '!untilt' || message === '!тильт -' || message === '!антильт') {
                if (!isLocked && currentTilt > 0) {
                    currentTilt -= STEP;
                    if (currentTilt < 0) currentTilt = 0;
                    updateUI();
                }
            }

            const isModOrBroadcaster = raw.includes('badges=broadcaster/1') || raw.includes('mod=1');
            if ((message === '!tilt reset' || message === '!сброс') && isModOrBroadcaster) {
                resetTilt();
            }
        }
    };
</script>

</body>
</html>
